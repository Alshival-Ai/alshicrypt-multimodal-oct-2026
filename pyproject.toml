[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alshicrypt-experimental"
version = "0.1.0"
description = "Reproducible experiments in learned stochastic image transformations"
requires-python = ">=3.12"
dependencies = ["torch==2.10.0", "numpy>=2,<3", "Pillow>=11", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
alshicrypt = "alshicrypt.cli:main"

[tool.setuptools.packages.find]
include = ["alshicrypt*", "paper_study*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
